[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "casecraft-api"
version = "1.0.0"
description = "AI-assisted requirements-based test case management API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "email-validator>=2.2,<3",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "httpx>=0.27,<1",
  "redis>=5,<6",
  "slowapi>=0.1.9,<1",
  "python-multipart>=0.0.18,<1",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2,<5",
  "prometheus-fastapi-instrumentator>=7,<8",
  "sentry-sdk[fastapi]>=2.19,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app.application"]
branch = true
omit = ["app/application/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
omit = ["app/main.py", "app/api/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
