services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: casecraft
      POSTGRES_USER: casecraft
      POSTGRES_PASSWORD: casecraft
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casecraft -d casecraft"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://casecraft:casecraft@postgres:5432/casecraft
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres_data:
